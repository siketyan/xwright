name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  API_LEVEL: 36

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Web and Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @xwright/playwright exec playwright install --with-deps chromium
      # The emulator needs about 7.5 GB for its data partition, more than the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /
      # The emulator needs hardware acceleration, which runners allow only after this.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Boots the emulator once and keeps it in the cache, so that later runs start from the snapshot.
      - name: Cache the AVD
        id: avd-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-${{ env.API_LEVEL }}-google_apis-x86_64
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the snapshot of the AVD."
      - name: Run the example on the web and an Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: pnpm --filter example-web-and-mobile test --project android --project web-only
