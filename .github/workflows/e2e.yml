name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Web and Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @xwright/playwright exec playwright install --with-deps chromium
      # The emulator needs hardware acceleration, which runners allow only after this.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the example on the web and an Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: pnpm --filter example-web-and-mobile test --project android --project web-only
