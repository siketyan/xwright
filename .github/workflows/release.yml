name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# With changesets, opens the PR that versions the packages. Once it is merged, packs the packages and publishes them
# to npm by trusted publishing. Only the publish job can publish, and it runs only the packed tarballs.
jobs:
  select-mode:
    name: Select the mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v3.1.1
        with:
          cache: false
          require-lockfile: true
      - name: Select the mode of changesets
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v3.1.1
        with:
          cache: false
          require-lockfile: true
      - name: Open the PR to version the packages
        uses: changesets/action/version@v2.1.2

  pack:
    name: Pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v3.1.1
        with:
          cache: false
          require-lockfile: true
      - name: Build
        run: pnpm build
      - name: Pack the packages
        id: pack
        uses: changesets/action/pack@v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The trusted publishers of the packages on npm name this environment.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v3.1.1
        with:
          cache: false
          require-lockfile: true
      - name: Publish the packages and create the releases
        uses: changesets/action/publish@v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
