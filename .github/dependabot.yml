version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Mobilewright pins Playwright, so bump them together.
      mobilewright:
        patterns:
          - mobilewright
          - "@mobilewright/*"
          - playwright
